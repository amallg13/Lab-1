<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>60 Seconds</title>

  <link rel="stylesheet" href="style.css" />
</head>


<body>

  <!-- START -->

  <section class="hero parallax">

    <div class="card">

      <p class="time">8:59 AM</p>

      <h1>You have class.</h1>

      <p>
        And it starts in one minute.
      </p>

      <p class="scroll">
        ↓ Scroll
      </p>

    </div>

  </section>



  <!-- PANIC -->

  <section class="content panic">

    <div class="card">

      <h2>WAIT...</h2>

      <p>
        You have class at 9:00.
      </p>

      <div class="emoji">
        😴 → 😱
      </div>

      <p>
        Time to move.
      </p>

    </div>

  </section>



  <!-- GET READY -->

  <section class="hero parallax backpack">

    <div class="card">

      <h2>Grab your stuff.</h2>

      <p>
        Backpack. Phone. Keys.
      </p>

      <div class="emoji">
        🎒
      </div>

    </div>

  </section>



  <!-- LEAVE -->

  <section class="content">

    <div class="card">

      <h2>GET OUT.</h2>

      <p>
        There is no time to waste.
      </p>

      <div class="emoji">
        🏃
      </div>

    </div>

  </section>



  <!-- BUS -->

  <section class="hero parallax bus">

    <div class="card">

      <h2>You see the bus.</h2>

      <p>
        This is your only chance.
      </p>

      <div class="emoji">
        🚌
      </div>

    </div>

  </section>



  <!-- END -->

  <section class="content ending">

    <div class="card">

      <h1>9:00 AM</h1>

      <h2>You made it.</h2>

      <p>
        ...barely.
      </p>

    </div>

  </section>


</body>

</html>
